[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gladiators"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gladiators = "gladiators.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
# A P0 regression-lock contract that starts passing must fail loudly, never pass
# quietly — see tests/test_p0_regression_lock.py.
xfail_strict = true
markers = ["p0_contract(case_id): P0 regression-lock contract from eval/p0_probes.json"]
